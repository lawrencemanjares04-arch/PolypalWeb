<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PolyPal</title>
    <link rel="stylesheet" href="polypal.css">
    <link rel="icon" type="image/png" href="/image/logo.png">
</head>
<body class="loginpage">
    <main class="logincont">
        <img id="logo" src="/image/logo.png" alt="PolyPal Logo">
        
        <form id="loginForm" method="post" action="/api/login" novalidate>
            <div class="form-group">
                <label for="username" class="visually-hidden">Username</label>
                <input 
                    id="username" 
                    name="username"
                    type="text" 
                    placeholder="Username" 
                    class="input-box" 
                    minlength="8" 
                    maxlength="15" 
                    autocomplete="username"
                    required>
            </div>
            
            <div class="form-group">
                <label for="password" class="visually-hidden">Password</label>
                <input 
                    id="password"
                    name="password" 
                    type="password" 
                    placeholder="Password" 
                    class="input-box" 
                    minlength="8" 
                    maxlength="15"
                    autocomplete="current-password" 
                    required>
            </div>

            <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>
            
            <a id="forgot-password" href="/forgot-password.html" class="forgot-link">Forgot password?</a>
            
            <button type="submit" class="login-homebtn">Login</button>
            
            <p class="signup-prompt">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
        </form>
    </main>
    <script src="polypal.js"></script>
</body>
</html>
